<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>30-day future self challenge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1b1a18}a:hover{color:#000}
</style>
</helmet>
<div style="width: 794px; height: 1123px; position: relative; overflow: hidden; background: {{paper}}; font-family: 'Inter Tight', sans-serif; color: #1b1a18; box-sizing: border-box; padding: 64px 64px 56px; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #55524c"><span>Printable · cut it out, pin it up</span><span>The Rebrand Issue</span></div>
  <h2 style="margin: 30px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 84px; line-height: 0.86; letter-spacing: -0.02em">30-day future <span style="font-style: italic">self challenge.</span></h2>
  <div style="margin-top: 16px; display: flex; align-items: center; gap: 16px">
    <span style="display: block; width: 120px; height: 6px; background: linear-gradient(90deg, #EAF6FF 0%, #D9B3FF 35%, #FF4DB8 72%, #FF9A7A 100%)"></span>
    <p style="margin: 0; font-size: 14px">One prompt a day. One line is enough. Cross off each day when it’s done.</p>
  </div>
  <div style="margin-top: 26px; flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 0; border-top: 1px solid #1b1a18; border-left: 1px solid #1b1a18">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="30">
      <div style="border-right: 1px solid #1b1a18; border-bottom: 1px solid #1b1a18; padding: 10px; display: flex; flex-direction: column; gap: 6px; background: {{d.bg}}">
        <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 22px; line-height: 1">{{d.n}}</span>
        <span style="font-size: 11.5px; line-height: 1.3">{{d.t}}</span>
      </div>
    </sc-for>
  </div>
  <div style="margin-top: 14px; display: flex; justify-content: space-between; font-size: 11px"><span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 16px">Same girl, bigger dreams.</span><span>18</span></div>
  <svg style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: multiply; opacity: {{grain}}" aria-hidden="true"><filter id="grainC"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grainC)"/></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paper":{"editor":"color","default":"#F3EFE7","options":["#F3EFE7","#F6F3EE","#FFFFFF"]},"grain":{"editor":"range","default":0.22,"min":0,"max":0.5,"step":0.02},"$preview":{"width":794,"height":1123}}'>
class Component extends DCLogic {
  renderVals() {
    const t = ['your 2027 in one word', 'describe a normal Tuesday in 2027', 'what are you done tolerating?', 'one habit future you has', 'future you’s morning, hour by hour', 'what does home look like?', 'a letter from future you', 'what are you building?', 'who do you want around you?', 'what does money feel like?', 'dress for the life you want', 'one thing to start tonight', 'what would you try if no one watched?', 'your rebrand in 3 photos', 'what does rest look like?', 'a fear future you is over', 'one money move this week', 'where are you in 12 months?', 'what is more possible now?', 'your cover line for 2027', 'what are you proud of?', 'one small risk this week', 'what will you stop explaining?', 'a playlist for future you', 'what does future you say no to?', 'describe your ideal weekend', 'one boundary to keep', 'what changed this month?', 'what are you claiming?', 'read day 1 again'];
    const days = t.map((x, i) => ({ n: String(i + 1).padStart(2, '0'), t: x, bg: (i % 7 === 3) ? '#F7C6D9' : 'transparent' }));
    return { paper: this.props.paper ?? '#F3EFE7', grain: this.props.grain ?? 0.22, days };
  }
}
</script>
</body>
</html>
