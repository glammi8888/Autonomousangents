<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chapter Fashion spread</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1b1a18}a:hover{color:#000}
</style>
</helmet>
<div style="width: 1632px; height: 1056px; position: relative; overflow: hidden; background: {{paper}}; font-family: 'Inter Tight', sans-serif; color: #1b1a18; display: flex">
  <div style="width: 816px; height: 1056px; position: relative; box-sizing: border-box; padding: 64px 88px 64px 72px; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #55524c"><span>Chapter 05 · Prompts 16–20</span><span>The Rebrand Issue</span></div>
    <h2 style="margin: 34px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 150px; line-height: 0.8; letter-spacing: -0.03em">Fashion.</h2>
    <p style="margin: 10px 0 0; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 30px">Dress for the life you want</p>
    <div style="margin-top: 34px; columns: 2; column-gap: 32px; column-rule: 1px solid rgba(27,26,24,0.25); text-align: justify; hyphens: auto">
      <sc-for list="{{prompts}}" as="p" hint-placeholder-count="5">
        <div style="break-inside: avoid; margin-bottom: 16px">
          <p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: -0.01em; text-align: left"><span style="font-family: 'Instrument Serif', serif; font-weight: 400; font-style: italic; font-size: 18px; margin-right: 6px; color: #8a6170">{{p.n}}</span>{{p.title}}</p>
          <p style="margin: 0; font-size: 12.5px; line-height: 1.48">“{{p.text}}”</p>
          <p style="margin: 5px 0 0; font-size: 11px; line-height: 1.4; color: #55524c; text-align: left"><span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 13px; color: #1b1a18">Why it works:</span> {{p.why}}</p>
        </div>
      </sc-for>
    </div>
    <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #1b1a18; padding-top: 12px">
      <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 19px">Your style, front page.</span>
      <span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase">12 · issue11.app</span>
    </div>
  </div>
  <div style="width: 816px; height: 1056px; position: relative; overflow: hidden; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #1b1a18">
    <img src="/_blob/04e1e88d776f917541f6c0cbdc6d49d4" alt="A model with long copper hair in a chrome sculpted jacket, seen from behind" style="width: 100%; height: 1056px; object-fit: cover; filter: contrast(1.05) saturate(0.85) sepia(0.1)">
    <img src="/_blob/bee38449fbf73a6689d9321f33a525e9" alt="A model with long black hair in a chrome puffed jacket, seen from behind" style="width: 100%; height: 1056px; object-fit: cover; filter: contrast(1.05) saturate(0.85) sepia(0.1)">
    <p style="position: absolute; left: 0; right: 0; bottom: 70px; margin: 0; text-align: center; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 64px; line-height: 0.9; color: #fff; text-shadow: 0 2px 20px rgba(0,0,0,0.3)">“Dress for the life you want.”</p>
    <span style="position: absolute; right: 48px; bottom: 30px; font-size: 11px; color: #fff">13</span>
  </div>
  <div style="position: absolute; left: 766px; top: 0; width: 100px; height: 1056px; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.10) 42%, rgba(0,0,0,0.22) 50%, rgba(255,255,255,0.10) 54%, rgba(0,0,0,0.06) 62%, rgba(0,0,0,0) 100%)"></div>
  <svg style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: multiply; opacity: {{grain}}" aria-hidden="true"><filter id="grainF"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grainF)"/></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paper":{"editor":"color","default":"#F3EFE7","options":["#F3EFE7","#F6F3EE","#FFFFFF"]},"grain":{"editor":"range","default":0.22,"min":0,"max":0.5,"step":0.02},"$preview":{"width":1632,"height":1056}}'>
class Component extends DCLogic {
  renderVals() {
    const prompts = [
      { n: '16', title: 'My three style words.', text: 'Interview me about outfits I love, pins I save and how I want to feel getting dressed. Help me pick three style words, then test them on a workday, a weekend and a night out.', why: 'Enclothed cognition: what you wear can shift how you think and act.' },
      { n: '17', title: 'Shop my closet first.', text: 'Help me make new outfits from what I already own: [describe or share photos]. Start with my favorite pieces. Only list real gaps at the end.', why: 'Starting from what you love builds on what already works.' },
      { n: '18', title: 'A signature look that feels like me.', text: 'Using my favorite colors, shapes and pieces, give me three outfit formulas I’d happily wear on repeat, for different weather and plans.', why: 'Identity-based habits: every outfit is a small vote for who you’re becoming.' },
      { n: '19', title: 'A wish list with standards.', text: 'Ask about my budget, my gaps and purchases I loved or regretted. Help me set rules an item has to pass, and a 48-hour pause for anything I’m unsure about.', why: 'A short pause between wanting and buying helps you pick what you’ll love.' },
      { n: '20', title: 'Getting dressed is the easy part.', text: 'Ask which moments make me feel like I have nothing to wear. Build outfit formulas for them from my closet, shoes and accessories included.', why: 'Fewer small decisions in the morning leave room for the big ones.' }
    ];
    return { paper: this.props.paper ?? '#F3EFE7', grain: this.props.grain ?? 0.22, prompts };
  }
}
</script>
</body>
</html>
