<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your 2027 cover spread</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1632px; height: 1056px; position: relative; overflow: hidden; background: {{paper}}; font-family: 'Inter Tight', sans-serif; color: #1b1a18; display: flex">
  <div style="width: 816px; height: 1056px; position: relative; overflow: hidden">
    <img src="/_blob/903045908030c2629df5640cb6d302f5" alt="An aspirational editorial portrait" style="width: 100%; height: 100%; object-fit: cover; filter: contrast(1.05) saturate(0.85) sepia(0.1)">
    <span style="position: absolute; left: 40px; top: 44px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #fff">Your turn</span>
    <p style="position: absolute; left: 40px; right: 56px; bottom: 70px; margin: 0; font-family: 'Instrument Serif', serif; font-size: 78px; line-height: 0.88; color: #fff; text-shadow: 0 2px 20px rgba(0,0,0,0.3)">You’re the <span style="font-style: italic">main story.</span></p>
  </div>
  <div style="width: 816px; height: 1056px; position: relative; box-sizing: border-box; padding: 64px 72px 56px 88px; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #55524c"><span>Design your 2027 cover</span><span>The Rebrand Issue</span></div>
    <p style="margin: 18px 0 0; font-size: 13px; line-height: 1.5; max-width: 560px">Use the five cover lines from prompt 30. Stick in a photo of you, or draw one. This is your issue.</p>
    <div style="margin-top: 22px; flex: 1; position: relative; border: 1px solid #1b1a18; background: #fff; box-sizing: border-box; padding: 28px 30px; display: flex; flex-direction: column">
      <img src="/_blob/305b5f5417ab22fc94506ed8ebc834fe" alt="ISSUE11" style="height: 54px; width: auto; align-self: flex-start">
      <div style="margin-top: 6px; display: flex; justify-content: space-between; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: #55524c"><span>Issue 2027</span><span>Starring: ____________</span></div>
      <div style="margin-top: 18px; flex: 1; border: 1.5px dashed rgba(27,26,24,0.45); display: flex; align-items: center; justify-content: center">
        <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 26px; color: #8a6170">your photo here</span>
      </div>
      <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 14px">
        <sc-for list="{{lines}}" as="l" hint-placeholder-count="5">
          <div style="display: flex; align-items: baseline; gap: 10px"><span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 18px; color: #8a6170">{{l.n}}</span><div style="flex: 1; border-bottom: 1px solid rgba(27,26,24,0.4); height: 18px"></div></div>
        </sc-for>
      </div>
    </div>
    <div style="margin-top: 22px; display: flex; justify-content: space-between; align-items: center; gap: 20px">
      <span style="font-family: 'Instrument Serif', serif; font-size: 24px; line-height: 1.05">Want your cover made for you? <span style="font-style: italic">Make your own issue.</span></span>
      <span style="flex: none; padding: 12px 20px; border-radius: 999px; background: #1b1a18; color: #fff; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase">issue11.app</span>
    </div>
  </div>
  <div style="position: absolute; left: 766px; top: 0; width: 100px; height: 1056px; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.10) 42%, rgba(0,0,0,0.22) 50%, rgba(255,255,255,0.10) 54%, rgba(0,0,0,0.06) 62%, rgba(0,0,0,0) 100%)"></div>
  <svg style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: multiply; opacity: {{grain}}" aria-hidden="true"><filter id="grainC"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grainC)"/></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paper":{"editor":"color","default":"#F3EFE7","options":["#F3EFE7","#F6F3EE","#FFFFFF"]},"grain":{"editor":"range","default":0.22,"min":0,"max":0.5,"step":0.02},"$preview":{"width":1632,"height":1056}}'>
class Component extends DCLogic {
  renderVals() {
    const lines = ['01', '02', '03', '04', '05'].map(n => ({ n }));
    return { paper: this.props.paper ?? '#F3EFE7', grain: this.props.grain ?? 0.22, lines };
  }
}
</script>
</body>
</html>
