<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Style B · Scattered type</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:1588px; height:1123px; position:relative; overflow:hidden; background:#FFFFFF; font-family:'Inter Tight', sans-serif; color:#0D0D0D; display:flex">

<div style="width:794px; height:1123px; position:relative; overflow:hidden; box-sizing:border-box; background:#fff">
  <span style="position:absolute; left:70px; top:120px; font-size:150px; font-weight:500; letter-spacing:-0.06em; line-height:0.86">l</span><span style="position:absolute; left:330px; top:300px; font-size:150px; font-weight:500; letter-spacing:-0.06em; line-height:0.86">o</span><span style="position:absolute; left:120px; top:520px; font-size:150px; font-weight:500; letter-spacing:-0.06em; line-height:0.86">v</span><span style="position:absolute; left:520px; top:700px; font-size:150px; font-weight:500; letter-spacing:-0.06em; line-height:0.86">e</span>
  <p style="position:absolute; left:640px; top:120px; margin:0; writing-mode:vertical-rl; font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase">Chapter 04 · Prompts 11–15</p>
  <div style="position:absolute; left:72px; right:88px; bottom:64px; columns:2; column-gap:28px; text-align:justify; hyphens:auto"><sc-for list="{{prompts}}" as="p" hint-placeholder-count="5">
  <div style="break-inside:avoid; margin-bottom:14px">
    <p style="margin:0 0 3px; font-size:12.5px; font-weight:600; letter-spacing:-0.02em; text-align:left"><span style="color:#E84C7A; margin-right:6px">{{p.n}}</span>{{p.title}}</p>
    <p style="margin:0; font-size:11.5px; line-height:1.48">“{{p.text}}”</p>
    <p style="margin:4px 0 0; font-size:10.5px; line-height:1.4; opacity:0.7; text-align:left">Why it works: {{p.why}}</p>
  </div>
</sc-for></div>
</div>
<div style="width:794px; height:1123px; position:relative; overflow:hidden; box-sizing:border-box">
  <img src="/_blob/0e3d5984b4c70c2684bc95d0d793d137" alt="Aspirational editorial photo" style="display:block; object-fit:cover; filter: contrast(1.04) saturate(0.9); position:absolute; inset:0; width:100%; height:100%">
  <p style="position:absolute; left:88px; bottom:70px; margin:0; font-size:56px; font-weight:500; letter-spacing:-0.06em; line-height:0.86; color:#fff">My people, my circle.</p>
  <span style="position:absolute; right:48px; bottom:36px; font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:#fff">11</span>
</div>
<div style="position:absolute; left:744px; top:0; width:100px; height:1123px; pointer-events:none; background:linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.08) 42%, rgba(0,0,0,0.18) 50%, rgba(255,255,255,0.10) 54%, rgba(0,0,0,0.05) 62%, rgba(0,0,0,0) 100%)"></div>
<svg style="position:absolute; inset:0; width:100%; height:100%; pointer-events:none; mix-blend-mode:multiply; opacity:{{grain}}" aria-hidden="true"><filter id="g1"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g1)"/></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"grain":{"editor":"range","default":0.16,"min":0,"max":0.5,"step":0.02},"$preview":{"width":1588,"height":1123}}'>
class Component extends DCLogic {
  renderVals() {
    const prompts = [{"n": "11", "title": "What my kind of love looks like.", "text": "Ask about affection, communication, independence and how we handle disagreements. Help me sort needs, nice-to-haves and what I’m still figuring out.", "why": "Knowing your values makes the big choices easier."}, {"n": "12", "title": "Friends we actually make time for.", "text": "Ask who I want to see more and what gets in the way. Help me write one if-then plan.", "why": "If-then plans make follow-through much more likely."}, {"n": "13", "title": "Meet more of my people.", "text": "Ask about my interests and places I already like. Suggest three settings where I’d see the same people often.", "why": "Seeing the same faces again and again is how friendships start."}, {"n": "14", "title": "Say no, kindly.", "text": "Help me write a short, kind way to set a boundary with [person]. Then play them, and give me feedback.", "why": "Ready-made words lower the cost of a boundary."}, {"n": "15", "title": "My inner critic is loud today.", "text": "Here’s what it says: [paste]. Ask me to check the evidence: what’s true, what’s old, and what a friend would say.", "why": "Questioning a thought (from CBT) loosens its grip."}];
    return { grain: this.props.grain ?? 0.16, prompts };
  }
}
</script>
</body>
</html>
